# Releases only when a release/<version> PR merges (open one with `yarn release <version>`): npm publish via
# trusted publishing (the npmjs.com trusted publisher must point at this file), tag v<version>, GitHub
# release with the PR description as notes. Dispatch re-runs an existing release; every step is idempotent.
name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version to re-publish (e.g. 0.3.0)
        required: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance, no token needed

    steps:
      - name: Resolve version
        id: v
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${HEAD_REF#release/}}"
          VERSION="${VERSION#v}"
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a semver: '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.version && format('v{0}', steps.v.outputs.version) || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Point npm at the public registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: package.json must match the release version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$VERSION"

      - name: Build
        run: |
          yarn nitrogen
          yarn prepare

      - name: Publish to npm
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if npm view "@obitrain/react-native-notifications@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION already on npm, skipping"
          else
            npm publish --provenance
          fi

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TAG="v$VERSION"
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || { git tag "$TAG" && git push origin "$TAG"; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/notes.md
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
