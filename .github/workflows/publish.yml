name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance, no token needed

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Point npm at the public registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "${{ github.ref_name }}" ] || { echo "package.json is $PKG, tag is ${{ github.ref_name }}"; exit 1; }

      - name: Build
        run: |
          yarn nitrogen
          yarn prepare

      - name: Publish to npm
        run: npm publish --provenance
