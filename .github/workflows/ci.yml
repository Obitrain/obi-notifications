name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck


  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  expo-checks:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      GOOGLE_SERVICES_JSON: ./google-services.ci.json
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Check Expo dependencies
        working-directory: example
        run: npx --yes expo-doctor@1.20.4 --verbose

      - name: Export native bundles
        run: yarn example export

      - name: Test config plugins
        run: yarn example test:plugins

  build-android:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      GOOGLE_SERVICES_JSON: ./google-services.ci.json
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate Android project
        run: yarn example prebuild --clean --no-install --platform android

      - name: Build Android example
        run: yarn example build:android

  build-ios:
    runs-on: macos-latest
    env:
      CI: '1'
      GOOGLE_SERVICES_JSON: ./google-services.ci.json
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '26'

      - name: Generate iOS project
        run: yarn example prebuild --clean --no-install --platform ios

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      - name: Build iOS example
        run: yarn example build:ios

