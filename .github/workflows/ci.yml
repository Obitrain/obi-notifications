name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generated Nitro code must be committed and current
        run: yarn nitrogen && git diff --exit-code -- nitrogen src/generated

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck


  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  expo-checks:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      GOOGLE_SERVICES_JSON: ./google-services.ci.json
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Check Expo dependencies
        working-directory: example
        run: npx --yes expo-doctor@1.20.4 --verbose
        env:
          # patch drift is handled by Renovate after minimumReleaseAge
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: 1

      - name: Export native bundles
        run: yarn example export

      - name: Test config plugins
        run: yarn example test:plugins

  build-android:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      GOOGLE_SERVICES_JSON: ./google-services.ci.json
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Install JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate Android project
        run: yarn example prebuild --clean --no-install --platform android

      - name: Build Android example
        run: yarn example build:android

  build-ios:
    runs-on: macos-latest
    env:
      CI: '1'
      GOOGLE_SERVICES_JSON: ./google-services.ci.json
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - name: Generate iOS project
        run: yarn example prebuild --clean --no-install --platform ios

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      - name: Build iOS example
        run: yarn example build:ios

